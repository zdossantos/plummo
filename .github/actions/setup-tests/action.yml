name: Set up Plummo tests
description: Install the locked dependencies and build the assets used by tests.
inputs:
    browser:
        description: Install Chromium and its system dependencies.
        default: 'false'
runs:
    using: composite
    steps:
        - uses: shivammathur/setup-php@v2
          with:
              php-version: '8.4.27'
              extensions: pdo_mysql, redis
              coverage: none
        - uses: actions/setup-node@v7
          with:
              node-version-file: .node-version
        - uses: oven-sh/setup-bun@v2
          with:
              bun-version: '1.3.14'
        - run: composer install --no-interaction --prefer-dist
          shell: bash
        - run: cp .env.example .env && php artisan key:generate
          shell: bash
        - run: bun install --frozen-lockfile
          shell: bash
        - run: php artisan wayfinder:generate --with-form
          shell: bash
        - run: bun run build
          shell: bash
        - if: ${{ inputs.browser == 'true' }}
          run: bunx playwright install --with-deps chromium
          shell: bash
