name: Release proposal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # PRs created with GITHUB_TOKEN do not trigger pull_request workflows.
      - name: Check the release pull requests
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          while read -r number; do
            branch=$(gh api "repos/$GH_REPO/pulls/$number" --jq '.head.ref')
            gh workflow run ci.yml --ref "$branch"
            gh workflow run pr-title.yml --ref "$branch" -f pull-request-number="$number"
          done < <(jq -r '.[].number' <<< "$RELEASE_PRS")

  publish-image:
    name: Publish release image
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release and public build configuration
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          test "v$(jq -r '."."' .release-please-manifest.json)" = "$RELEASE_TAG"
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish exact release
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ env.RELEASE_TAG }}-${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=runtime-image
          cache-to: type=gha,mode=max,scope=runtime-image
      - name: Verify the published image by digest
        id: reference
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="$IMAGE_NAME@$IMAGE_DIGEST"
          bash .github/scripts/smoke-image.sh "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io

  deploy-release:
    name: Record image and deploy to Coolify
    needs: [release, publish-image]
    if: ${{ needs.release.outputs.release_created == 'true' && needs.publish-image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_CREATED: ${{ needs.release.outputs.release_created }}
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      APP_IMAGE: ${{ needs.publish-image.outputs.image }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - name: Attach deployment reference to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --arg version "$RELEASE_TAG" --arg commit "$RELEASE_SHA" --arg image "$APP_IMAGE" \
            '{version: $version, commit: $commit, image: $image, platform: "linux/amd64"}' > container-image.json
          gh release upload "$RELEASE_TAG" container-image.json --clobber
          cat container-image.json >> "$GITHUB_STEP_SUMMARY"
      - name: Deployment configuration pending
        if: ${{ vars.COOLIFY_APPLICATION_UUID == '' }}
        run: echo 'Image verified and recorded. Configure the dedicated Plummo Coolify resource to enable deployment.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy release to Coolify
        if: ${{ vars.COOLIFY_APPLICATION_UUID != '' }}
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: bash .github/scripts/deploy-release.sh
