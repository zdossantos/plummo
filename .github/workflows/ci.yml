name: CI
on:
    pull_request:
    workflow_dispatch:
    push:
        branches: [main]
permissions:
    contents: read
jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: plummo_testing
                    MYSQL_USER: plummo
                    MYSQL_PASSWORD: local-only
                    MYSQL_ROOT_PASSWORD: local-root-only
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping -h localhost"
                    --health-interval=10s --health-timeout=5s --health-retries=10
        env:
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: plummo_testing
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_mysql, redis
                  coverage: none
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.14'
            - run: composer install --no-interaction --prefer-dist
            - run: cp .env.example .env && php artisan key:generate
            - run: bun install --frozen-lockfile
            - run: php artisan wayfinder:generate --with-form
            - run: composer lint:check && composer analyse
            - run: bun run lint:check && bun run format:check && bun run types:check && bun run test:unit && bun run build
            - run: bunx playwright install --with-deps chromium
            - run: APP_ENV=testing php artisan migrate --force
            - run: php artisan test
    runtime:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - run: python3 .github/scripts/test-deploy-release.py
            - run: bash -n .github/scripts/deploy-release.sh .github/scripts/smoke-image.sh && sh -n docker/entrypoint.sh
            - run: docker build --target runtime -t plummo:ci .
            - run: bash .github/scripts/smoke-image.sh plummo:ci
            - run: |
                  docker run -d --name plummo-ci -p 8080:80 -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= -e APP_ENV=testing -e SESSION_DRIVER=array -e CACHE_STORE=array plummo:ci
                  for attempt in $(seq 1 30); do
                    if curl --fail http://localhost:8080/up; then break; fi
                    sleep 2
                  done
                  curl --fail http://localhost:8080/up
                  curl --fail http://localhost:8080/join > /tmp/join.html
                  docker exec plummo-ci test -f public/build/manifest.json
            - name: Reverb WebSocket handshake
              run: |
                  docker run -d --name plummo-reverb-ci -p 8081:8080 -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= -e APP_ENV=testing -e CACHE_STORE=array -e REVERB_APP_ID=ci -e REVERB_APP_KEY=ci-public-key -e REVERB_APP_SECRET=ci-only-secret -e REVERB_ALLOWED_ORIGINS=localhost --user www-data plummo:ci reverb
                  for attempt in $(seq 1 15); do
                    curl --silent --max-time 1 --dump-header /tmp/reverb.headers -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' -H 'Sec-WebSocket-Version: 13' -H 'Origin: http://localhost' 'http://localhost:8081/app/ci-public-key?protocol=7&client=js&version=8.6.0&flash=false' > /tmp/reverb.body || true
                    if grep -q '101 Switching Protocols' /tmp/reverb.headers && grep -q 'pusher:connection_established' /tmp/reverb.body; then break; fi
                    sleep 1
                  done
                  grep -q '101 Switching Protocols' /tmp/reverb.headers
                  grep -q 'pusher:connection_established' /tmp/reverb.body
                  test "$(docker inspect --format '{{.State.Running}}' plummo-reverb-ci)" = true
                  docker logs plummo-reverb-ci
