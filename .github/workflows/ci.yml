name: CI
on:
    pull_request:
    workflow_dispatch:
    push:
        branches: [main]
permissions:
    contents: read
jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-tests
            - run: composer lint:check && composer analyse
            - run: bun run lint:check && bun run format:check && bun run types:check && bun run test:unit
            - run: php artisan test --testsuite=Unit --stop-on-failure
    tests:
        name: ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { suite: Feature, shard: 1, total: 2 }
                    - { suite: Feature, shard: 2, total: 2 }
                    - { suite: Browser, shard: 1, total: 4 }
                    - { suite: Browser, shard: 2, total: 4 }
                    - { suite: Browser, shard: 3, total: 4 }
                    - { suite: Browser, shard: 4, total: 4 }
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: plummo_testing
                    MYSQL_USER: plummo
                    MYSQL_PASSWORD: local-only
                    MYSQL_ROOT_PASSWORD: local-root-only
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping -h localhost"
                    --health-interval=10s --health-timeout=5s --health-retries=10
        env:
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: plummo_testing
            TEST_SUITE: ${{ matrix.suite }}
            TEST_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-tests
              with:
                  browser: ${{ matrix.suite == 'Browser' }}
            - run: APP_ENV=testing php artisan migrate --force
            - name: Run test shard
              shell: bash
              run: |
                  progress_log=$(mktemp)
                  tail -n +1 -F "$progress_log" &
                  progress_pid=$!
                  trap 'kill "$progress_pid" 2>/dev/null || true; rm -f "$progress_log"' EXIT
                  php artisan test --testsuite="$TEST_SUITE" --shard="$TEST_SHARD" --stop-on-failure --log-events-text "$progress_log"
    viewport:
        name: Viewport ${{ matrix.format }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                format: ['320x568', '360x640', '375x667', '390x664', '430x740', '667x375', '844x390', '768x1024', '1280x720', '1920x1080']
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-tests
              with:
                  browser: 'true'
            - run: bun run test:viewport
              env:
                  PLUMMO_VIEWPORT_FORMAT: ${{ matrix.format }}
    bonuses:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-tests
              with:
                  browser: 'true'
            - name: Bonus scenes, licensed audio and reduced motion
              run: bun run test:bonuses
    quality:
        needs: [checks, tests, viewport, bonuses]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Require every quality job to succeed
              env:
                  JOB_RESULTS: ${{ toJSON(needs) }}
              run: jq -e 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
    runtime:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - run: python3 .github/scripts/test-deploy-release.py
            - run: bash -n .github/scripts/deploy-release.sh .github/scripts/smoke-image.sh && sh -n docker/entrypoint.sh
            - run: docker build --target runtime -t plummo:ci .
            - run: bash .github/scripts/smoke-image.sh plummo:ci
            - run: |
                  docker run -d --name plummo-ci -p 8080:80 -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= -e APP_ENV=testing -e SESSION_DRIVER=array -e CACHE_STORE=array plummo:ci
                  for attempt in $(seq 1 30); do
                    if curl --fail http://localhost:8080/up; then break; fi
                    sleep 2
                  done
                  curl --fail http://localhost:8080/up
                  curl --fail http://localhost:8080/join > /tmp/join.html
                  docker exec plummo-ci test -f public/build/manifest.json
            - name: Reverb WebSocket handshake
              run: |
                  docker run -d --name plummo-reverb-ci -p 8081:8080 -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= -e APP_ENV=testing -e CACHE_STORE=array -e REVERB_APP_ID=ci -e REVERB_APP_KEY=ci-public-key -e REVERB_APP_SECRET=ci-only-secret -e REVERB_ALLOWED_ORIGINS=localhost --user www-data plummo:ci reverb
                  for attempt in $(seq 1 15); do
                    curl --silent --max-time 1 --dump-header /tmp/reverb.headers -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' -H 'Sec-WebSocket-Version: 13' -H 'Origin: http://localhost' 'http://localhost:8081/app/ci-public-key?protocol=7&client=js&version=8.6.0&flash=false' > /tmp/reverb.body || true
                    if grep -q '101 Switching Protocols' /tmp/reverb.headers && grep -q 'pusher:connection_established' /tmp/reverb.body; then break; fi
                    sleep 1
                  done
                  grep -q '101 Switching Protocols' /tmp/reverb.headers
                  grep -q 'pusher:connection_established' /tmp/reverb.body
                  test "$(docker inspect --format '{{.State.Running}}' plummo-reverb-ci)" = true
                  docker logs plummo-reverb-ci
