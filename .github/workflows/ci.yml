name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: bun install --frozen-lockfile
      - run: php artisan wayfinder:generate --with-form
      - run: composer lint:check && composer analyse
      - run: bun run lint:check && bun run format:check && bun run types:check && bun run test:unit && bun run build
      - run: bunx playwright install --with-deps chromium
      - run: php artisan test
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t plummo:ci .
      - run: |
          docker run -d --name plummo-ci -p 8080:80 -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= -e APP_ENV=testing -e SESSION_DRIVER=array -e CACHE_STORE=array plummo:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/up; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8080/up
          curl --fail http://localhost:8080/ > /tmp/home.html
          docker exec plummo-ci test -f public/build/manifest.json
