services:
  web:
    build:
      context: .
      target: runtime
    ports: ["127.0.0.1:8090:80"]
    env_file: .env
    environment:
      APP_URL: http://localhost:8090
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: plummo
      MYSQL_USER: plummo
      MYSQL_PASSWORD: local-only
      MYSQL_ROOT_PASSWORD: local-root-only
    ports: ["127.0.0.1:3309:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/testing.sql:/docker-entrypoint-initdb.d/testing.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  mysql-data:
